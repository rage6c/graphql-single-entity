services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: graphql_sample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphql_sample"]
      interval: 5s
      timeout: 3s
      retries: 10
